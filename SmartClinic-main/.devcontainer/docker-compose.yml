services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/SmartClinic:cached
    command: sleep infinity
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: smartclinic_db
    ports:
      - "3306:3306"
    volumes:
      - smartclinic-mysql:/var/lib/mysql
      - ../docs/smartclinic_1p.sql:/docker-entrypoint-initdb.d/01_smartclinic.sql:ro

volumes:
  smartclinic-mysql:
