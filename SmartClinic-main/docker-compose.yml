services:
  app:
    build: .
    container_name: smartclinic_app
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: smartclinic_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: smartclinic_db
    ports:
      - "3306:3306"
    volumes:
      - smartclinic_mysql:/var/lib/mysql
      - ./docs/smartclinic_1p.sql:/docker-entrypoint-initdb.d/01_smartclinic.sql:ro
    restart: unless-stopped

volumes:
  smartclinic_mysql:
